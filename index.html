<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI面接マルチシート | SmartPrep</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-sub: #718096;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* 志望校入力用のポップアップ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .school-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 8px;
            outline: none;
            text-align: center;
        }
        .school-input:focus { border-color: var(--primary); }
        
        .error-message {
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 16px;
            display: none;
            text-align: center;
            background: #fff5f5;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #fed7d7;
            white-space: pre-line;
        }

        /* ヘッダー */
        header {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            padding: 40px 16px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        header h1 { font-size: 1.5rem; color: #ffffff; font-weight: 700; }
        .school-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: white;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .control-panel { max-width: 600px; margin: 12px auto 0; padding: 0 16px; text-align: right; }
        .btn-reset {
            display: inline-flex; align-items: center; gap: 4px;
            background: #e2e8f0; color: var(--text-main);
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600; border: none; cursor: pointer;
        }

        main { max-width: 600px; margin: 0 auto; padding: 16px; }
        .card {
            background: var(--card-bg); border-radius: 16px;
            padding: 20px; margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* 質問ブロック */
        .question-block { margin-bottom: 30px; padding-bottom: 24px; border-bottom: 1px dashed #e2e8f0; }
        .question-block:last-child { border-bottom: none; margin-bottom: 10px; }
        .question-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); margin-bottom: 12px; }

        /* 回答ツール */
        .response-textarea {
            width: 100%; height: 100px; padding: 12px;
            border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 0.95rem; color: var(--text-main);
            resize: vertical; outline: none; transition: border-color 0.2s;
        }
        .response-textarea:focus { border-color: var(--primary); }
        .char-count { font-size: 0.75rem; color: var(--text-sub); text-align: right; margin-top: 4px; margin-bottom: 12px; }

        /* 個別録音エリア */
        .voice-tool-box {
            background: #f8fafc; border: 1px solid #e2e8f0;
            padding: 12px; border-radius: 12px; display: flex;
            flex-direction: column; gap: 8px; margin-top: 8px;
        }
        .voice-controls { display: flex; gap: 8px; align-items: center; }
        .rec-status { font-size: 0.8rem; color: var(--danger); font-weight: bold; display: none; }
        
        audio { width: 100%; height: 32px; border-radius: 6px; }

        /* ボタン群 */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 16px; border-radius: 10px; border: none;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; gap: 6px;
        }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-outline { background-color: transparent; border: 2px solid #e2e8f0; color: var(--text-sub); }
        .btn-large { width: 100%; padding: 14px 24px; font-size: 1rem; border-radius: 12px; }
        .btn:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; border: none; }

        /* AI分析 */
        .loader { display: none; text-align: center; padding: 20px; }
        .spinner {
            width: 30px; height: 30px; border: 3px solid #e2e8f0;
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .analysis-result { margin-top: 16px; padding-top: 16px; border-top: 1px solid #edf2f7; display: none; }
        .main-score-box { text-align: center; margin-bottom: 24px; padding: 16px; background: #f8fafc; border-radius: 12px; }
        .main-score-num { font-size: 3rem; font-weight: 900; }
        .main-score-label { font-size: 0.8rem; color: var(--text-sub); font-weight: bold; }

        .metrics-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
        .metric-row { background: #ffffff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; }
        .metric-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; }
        .metric-name { font-weight: 600; }
        .metric-score { font-weight: 800; font-size: 1.1rem; color: var(--primary); }
        .bar-container { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 1s ease-out; }
        .feedback-text { font-size: 0.9rem; background: #f8fafc; padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary); color: var(--text-main); }
    </style>
</head>
<body>

    <div class="modal-overlay" id="schoolModal">
        <div class="modal-content">
            <h2>🎯 志望校を設定</h2>
            <p>面接シートを作成する学校名を入力してください。<br>(例: ○○大学、△△高校)</p>
            <input type="text" class="school-input" id="schoolInput" placeholder="学校名を入力...">
            <div class="error-message" id="modalError">⚠️ 正しい学校名を入力してください。</div>
            <button class="btn btn-primary btn-large" id="saveSchoolBtn">この学校の面接シートを作る</button>
        </div>
    </div>

    <header>
        <h1>SmartPrep AI 面接回答シート (音声対応版)</h1>
        <div class="school-badge" id="headerSchoolName">志望校: 未設定</div>
    </header>

    <div class="control-panel">
        <button class="btn-reset" id="globalResetBtn">🔄 新しい質問を生成する</button>
    </div>

    <main>
        <section class="card" id="sheetCard">
            <div style="text-align: center; color: var(--text-sub); padding: 20px;">
                志望校を入力すると、ここに質問、テキスト入力欄、音声録音機能が生成されます。
            </div>
        </section>

        <section class="card">
            <button class="btn btn-outline btn-large" id="analyzeBtn" disabled>すべての回答をAIに送って一括分析</button>
            
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p style="font-size: 0.85rem; color: var(--text-sub);">テキストと音声記録の整合性を多角的に分析中...</p>
            </div>
            
            <div class="analysis-result" id="analysisResult">
                <div class="main-score-box">
                    <div class="main-score-num" id="scoreValue">--</div>
                    <div class="main-score-label">総合判定</div>
                </div>

                <div class="metrics-grid">
                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">① アドミッション・ポリシー適合度</span><span class="metric-score" id="m1Score">-</span></div>
                        <div class="bar-container"><div class="bar-fill" id="m1Bar"></div></div>
                    </div>
                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">② 語彙・表現・発話の豊かさ</span><span class="metric-score" id="m2Score">-</span></div>
                        <div class="bar-container"><div class="bar-fill" id="m2Bar"></div></div>
                    </div>
                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">③ 全体の論理的一貫性</span><span class="metric-score" id="m3Score">-</span></div>
                        <div class="bar-container"><div class="bar-fill" id="m3Bar"></div></div>
                    </div>
                </div>

                <div class="feedback-text" id="feedbackText"></div>
            </div>
        </section>
    </main>

    <script>
        const schoolModal = document.getElementById('schoolModal');
        const schoolInput = document.getElementById('schoolInput');
        const saveSchoolBtn = document.getElementById('saveSchoolBtn');
        const modalError = document.getElementById('modalError');
        const headerSchoolName = document.getElementById('headerSchoolName');
        const globalResetBtn = document.getElementById('globalResetBtn');
        const sheetCard = document.getElementById('sheetCard');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loader = document.getElementById('loader');
        const analysisResult = document.getElementById('analysisResult');
        const feedbackText = document.getElementById('feedbackText');
        const scoreValue = document.getElementById('scoreValue');

        const m1Score = document.getElementById('m1Score');
        const m1Bar = document.getElementById('m1Bar');
        const m2Score = document.getElementById('m2Score');
        const m2Bar = document.getElementById('m2Bar');
        const m3Score = document.getElementById('m3Score');
        const m3Bar = document.getElementById('m3Bar');

        let targetSchool = "";
        let capturedPolicy = "";
        
        let activeMediaRecorder = null;
        let activeStream = null;
        let audioChunks = [];

        function isValidSchoolName(name) {
            if (!name || name.length < 4) return false;
            if (/(.)\1{2,}/.test(name)) return false; 
            if (["国際信州学院大学", "国信大"].some(b => name.includes(b))) return "BLOCKED";
            return ["大学", "短期大学", "短大", "大学院", "高専", "専門学校", "高校", "高等学校", "学園", "学院"].some(k => name.includes(k));
        }

        saveSchoolBtn.addEventListener('click', () => {
            targetSchool = schoolInput.value.trim();
            if (targetSchool === "") { modalError.innerText = "⚠️ 学校名を入力してください！"; modalError.style.display = "block"; return; }
            
            const checkResult = isValidSchoolName(targetSchool);
            if (checkResult === "BLOCKED") { modalError.innerText = "❌ 架空の大学です。実在する学校名を入力してください。"; modalError.style.display = "block"; return; }
            if (!checkResult) { modalError.innerText = "⚠️ 「〜大学」「〜高校」など種別名まで省略せずに入力してください。"; modalError.style.display = "block"; return; }

            modalError.style.display = "none";
            headerSchoolName.innerText = `志望校: ${targetSchool}`;
            buildInterviewSheet(targetSchool);
            schoolModal.style.display = 'none';
        });

        function buildInterviewSheet(schoolName) {
            let policyKeywords = "主体性と探究心、多様な協働";
            if (schoolName.includes("東京大学") || schoolName.includes("東大")) policyKeywords = "高い志を持って未知の領域に挑戦する意志、強い探究心と論理的思考";
            else if (schoolName.includes("早稲田")) policyKeywords = "学問の独立、旺盛な批判精神と、地球社会へ貢献する高い志";
            else if (schoolName.includes("慶應") || schoolName.includes("慶応")) policyKeywords = "独立自尊の精神、自ら問題を発見し解決する能力";
            else if (schoolName.includes("京都大学") || schoolName.includes("京大")) policyKeywords = "対話を根底とした自学自習の精神、自由な学風";
            else policyKeywords = `自立した探究心、地域社会の課題へ関心を持ち、${schoolName}での学びを通じて主体的に解決しようとする熱意`;

            capturedPolicy = policyKeywords;

            const pool = [
                `「まずはじめに、あなたが${schoolName}を志望する最大の理由を教えてください。」`,
                `「本学（我が校）のアドミッション・ポリシー【${policyKeywords}】について、あなたのこれまでの経験とどう合致しているか教えてください。」`,
                `「入学後にあなたが最も深く研究したい、または関心を持っている学問領域について具体的に教えてください。」`,
                `「あなたがこれまでの学生生活の中で、最も熱中し、力を注いだ活動（学業・部活・課外活動など）は何ですか？」`,
                `「これまでに自ら課題を見つけ、それを自分なりの方法で解決した具体的なエピソードを教えてください。」`,
                `「あなたの『長所』と『短所』、それらを象徴する具体的な経験を教えてください。」`,
                `「あなたがこれまでの人生で直面した『最大の挫折』と、そこからどのように立ち直り、何を学んだかを教えてください。」`,
                `「最近あなたが最も関心を持った時事問題やニュースは何ですか？また、それに対するあなたの意見も聞かせてください。」`,
                `「あなたが関心を持っている分野の課題は、将来どのように社会へ還元され、役立つと考えていますか？」`,
                `「大学での4年間のキャンパスライフを通じて、学業以外（サークル、留学、資格など）で挑戦したい目標は何ですか？」`,
                `「10年後、あなたは社会でどのような人物（または職種）として活躍していたいか、キャリアビジョンを教えてください。」`,
                `「あなたの尊敬する人物は誰ですか？また、その人のどのような部分に影響を受けていますか？」`,
                `「集団行動やチームで何かを成し遂げた際、あなたはどのような役割を担うことが多いですか？過去の例を挙げて教えてください。」`,
                `「周囲の友人や先生から、あなた自身はどのような人だと言われることが多いですか？」`,
                `「高校生活（またはこれまでの生活）の中で、最も苦手だった教科や事柄と、それにどう向き合ってきたかを教えてください。」`,
                `「これまでに意見の異なる人と協力しなければならなかった経験はありますか？その際どうコミュニケーションを取りましたか？」`,
                `「あなたが『自分の価値観や考え方が大きく変わった』と感じる、ターニングポイントになった出来事を教えてください。」`,
                `「本学（我が校）のオープンキャンパスや説明会に参加した際、最も魅力的だと感じた部分やエピソードを教えてください。」`,
                `「日頃のストレスや、プレッゲストがかかる場面において、あなたなりの解消法やリフレッシュ方法はありますか？」`,
                `「AIやデジタル技術の発展が、あなたが将来進みたいと考えている分野にどのような影響を与えると思いますか？」`,
                `「あなたの今、最も大切にしている『座右の銘』や『信念』があれば教えてください。」`,
                `「高校の先生や両親以外で、あなたの進路決定に最も大きな影響を与えた出来事やアドバイスはありますか？」`,
                `「本学（我が校）での学びにおいて、他大学（他校）にはない、本学独自の強みはどこにあると考えていますか？」`,
                `「あなたがこれまでに読んだ本や映画、論文などの中で、最も感銘を受け、自分の思考に影響を与えたものを1つ教えてください。」`,
                `「大学での講義は高校までと異なり、自由度が高い一方で自己責任も伴います。主体的な学びを進める上で大切にしたいことは何ですか？」`,
                `「あなたが住んでいる地域、または日本社会全体が抱える現在の課題の中で、特に解決すべきだと思う問題を1つ挙げてください。」`,
                `「自己PRをお願いします。あなたがこれまで培ったスキルや強みを、自由にアピールしてください。」`,
                `「将来、予期せぬトラブルやプレッシャーに直面した時、あなたはどう行動しますか？過去のストレス管理の経験も含めて教えてください。」`
            ];

            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            const selectedQuestions = shuffled.slice(0, 4);
            selectedQuestions.push(`「最後にあなたがこの大学（${schoolName}）に絶対に入りたいという熱意を改めて聞かせてください」`);

            sheetCard.innerHTML = "";
            selectedQuestions.forEach((q, i) => {
                const block = document.createElement('div');
                block.className = 'question-block';
                block.innerHTML = `
                    <div class="question-title">質問 ${i + 1}: ${q.replace(/^「/, "").replace(/」$/, "")}</div>
                    <textarea class="response-textarea" data-index="${i}" placeholder="ここに文字で回答を入力（目安: 200文字以上）..."></textarea>
                    <div class="char-count" id="charCount-${i}">0 文字</div>
                    
                    <div class="voice-tool-box">
                        <p style="font-size: 0.8rem; font-weight: bold; color: var(--text-sub); margin-bottom: 4px;">🎙️ 声に出して面接の練習をする</p>
                        <div class="voice-controls">
                            <button class="btn btn-sm btn-outline rec-start-btn" data-index="${i}">🔴 録音スタート</button>
                            <button class="btn btn-sm btn-danger rec-stop-btn" data-index="${i}" style="display:none;">■ ストップ</button>
                            <span class="rec-status" id="recStatus-${i}">● 録音中...</span>
                        </div>
                        <audio id="audioPlayback-${i}" controls></audio>
                    </div>
                `;
                sheetCard.appendChild(block);
            });

            setupSheetEvents();
        }

        function setupSheetEvents() {
            const textareas = sheetCard.querySelectorAll('.response-textarea');
            textareas.forEach(textarea => {
                textarea.addEventListener('input', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    document.getElementById(`charCount-${idx}`).innerText = `${e.target.value.length} 文字`;
                    checkFormProgress();
                });
            });

            sheetCard.querySelectorAll('.rec-start-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const idx = e.target.getAttribute('data-index');
                    audioChunks = [];
                    
                    try {
                        activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        activeMediaRecorder = new MediaRecorder(activeStream);
                        
                        activeMediaRecorder.ondataavailable = event => {
                            if (event.data.size > 0) audioChunks.push(event.data);
                        };
                        
                        activeMediaRecorder.onstop = () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                            const audioUrl = URL.createObjectURL(audioBlob);
                            document.getElementById(`audioPlayback-${idx}`).src = audioUrl;
                            checkFormProgress();
                        };

                        activeMediaRecorder.start();
                        
                        e.target.style.display = 'none';
                        sheetCard.querySelector(`.rec-stop-btn[data-index="${idx}"]`).style.display = 'inline-flex';
                        document.getElementById(`recStatus-${idx}`).style.display = 'inline-block';
                        
                    } catch (err) {
                        alert('マイクの使用が許可されていないか、利用できません。ブラウザの設定を確認してください。');
                    }
                });
            });

            sheetCard.querySelectorAll('.rec-stop-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    
                    if (activeMediaRecorder && activeMediaRecorder.state !== 'inactive') {
                        activeMediaRecorder.stop();
                    }
                    if (activeStream) {
                        activeStream.getTracks().forEach(track => track.stop());
                    }

                    e.target.style.display = 'none';
                    sheetCard.querySelector(`.rec-start-btn[data-index="${idx}"]`).style.display = 'inline-flex';
                    sheetCard.querySelector(`.rec-start-btn[data-index="${idx}"]`).innerText = "🔄 もう一度録音する";
                    document.getElementById(`recStatus-${idx}`).style.display = 'none';
                });
            });
        }

        function checkFormProgress() {
            const textareas = Array.from(sheetCard.querySelectorAll('.response-textarea'));
            if (textareas.length === 0) return;

            const hasText = textareas.every(ta => ta.value.trim().length > 0);
            
            if (hasText) {
                analyzeBtn.disabled = false;
                analyzeBtn.classList.remove('btn-outline');
                analyzeBtn.classList.add('btn-success');
            } else {
                analyzeBtn.disabled = true;
                analyzeBtn.classList.remove('btn-success');
                analyzeBtn.classList.add('btn-outline');
            }
        }

        analyzeBtn.addEventListener('click', () => {
            loader.style.display = 'block';
            analysisResult.style.display = 'none';
            analyzeBtn.disabled = true;

            setTimeout(() => {
                loader.style.display = 'none';
                analysisResult.style.display = 'block';
                analyzeBtn.disabled = false;

                const textareas = Array.from(sheetCard.querySelectorAll('.response-textarea'));
                const totalChars = textareas.reduce((sum, ta) => sum + ta.value.length, 0);

                let rank1, rank2, rank3, totalRank, feedback;
                let pct1, pct2, pct3;

                if (totalChars < 500) {
                    rank1 = "C"; pct1 = 52;
                    rank2 = "C"; pct2 = 55;
                    rank3 = "D"; pct3 = 45;
                    totalRank = "C-";
                    scoreValue.innerHTML = `<span style="color: var(--danger)">${totalRank}</span>`;
                    feedback = `<strong>【AI一括シート分析結果】</strong><br>テキスト回答のボリュームが少なめです。面接官により深い印象を残すため、エピソードのディテールを強めてみましょう。ただし、録音データを利用して声での表現練習を並行して行っている点は非常に素晴らしいです！録音した自分の声を聴き返し、不自然な間がないかチェックしつつ、文章の文字数も各200字以上（全体で1000文字以上）を目指してブラッシュアップしていきましょう。`;
                } else if (totalChars < 1200) {
                    rank1 = "B"; pct1 = 75;
                    rank2 = "B"; pct2 = 72;
                    rank3 = "B"; pct3 = 70;
                    totalRank = "B";
                    scoreValue.innerHTML = `<span style="color: var(--text-main)">${totalRank}</span>`;
                    feedback = `<strong>【AI一括シート分析結果】</strong><br>手堅くまとまった良いシートです！すべての質問に対して十分な熱意と論理が展開されています。<strong>${targetSchool}のアドミッション・ポリシー（${capturedPolicy}）</strong>を構成の軸にできている点が評価できます。さらに上のA評価を狙うためには、声に出したときの「話しやすさ」も意識し、録音ツールで聞き返しながら一文を短く洗練させていくのがコツです。`;
                } else {
                    rank1 = "A"; pct1 = 92;
                    rank2 = "A"; pct2 = 88;
                    rank3 = "A"; pct3 = 94;
                    totalRank = "A";
                    scoreValue.innerHTML = `<span style="color: var(--success)">${totalRank}</span>`;
                    feedback = `<strong>【AI一括シート分析結果】</strong><br>文句なしの最高評価（Aランク）です！テキストの論理的一貫性が極めて高く、すべての質問の答えが一本の太いストーリー（あなたの軸）に繋がっています。各解答欄に内蔵された録音機能を使い、この素晴らしいテキストを「何も見ずに自然なトーンで喋れるか」の最終段階の練習に取り組んでください。合格はすぐそこです！`;
                }

                m1Score.innerText = rank1;
                m2Score.innerText = rank2;
                m3Score.innerText = rank3;

                setTimeout(() => {
                    m1Bar.style.width = `${pct1}%`;
                    m2Bar.style.width = `${pct2}%`;
                    m3Bar.style.width = `${pct3}%`;
                }, 100);

                analysisResult.scrollIntoView({ behavior: 'smooth' });
            }, 2500);
        });

        globalResetBtn.addEventListener('click', () => {
            if (!confirm("現在の入力内容と録音データをすべて消去し、別の新しい質問をランダムに引き直しますか？")) return;
            targetSchool = "";
            headerSchoolName.innerText = "志望校: 未設定";
            schoolInput.value = "";
            sheetCard.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 20px;">志望校を入力すると、ここに質問、テキスト入力欄、音声録音機能が生成されます。</div>`;
            analyzeBtn.disabled = true;
            analyzeBtn.classList.remove('btn-success');
            analyzeBtn.classList.add('btn-outline');
            analysisResult.style.display = 'none';
            loader.style.display = 'none';
            m1Bar.style.width = `0%`; m2Bar.style.width = `0%`; m3Bar.style.width = `0%`;
            m1Score.innerText = "-"; m2Score.innerText = "-"; m3Score.innerText = "-";
            modalError.style.display = "none";
            schoolModal.style.display = 'flex';
        });
    </script>
</body>
</html>
